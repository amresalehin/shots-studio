name: Flutter APK

on:
  pull_request:
    branches: [main]
    paths:
      - "shots_studio/**"
      - ".github/workflows/flutter_apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: shots_studio

      - name: Build release APK
        run: flutter build apk --flavor github --dart-define=BUILD_SOURCE=github --release
        working-directory: shots_studio

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shots-studio-release-apk
          path: shots_studio/build/app/outputs/flutter-apk/shots_studio-github-release-*.apk
          if-no-files-found: error
          retention-days: 14
